# dcm4che-ris-persistence Configuration

# ========================================
# Database Configuration
# ========================================

# PostgreSQL Configuration (Primary)
spring.datasource.url=jdbc:postgresql://localhost:5432/dcm4che_ris
spring.datasource.username=dcm4che
spring.datasource.password=dcm4che
spring.datasource.driver-class-name=org.postgresql.Driver

# MySQL Configuration (Alternative)
#spring.datasource.url=jdbc:mysql://localhost:3306/dcm4che_ris?useSSL=false&serverTimezone=UTC
#spring.datasource.username=dcm4che
#spring.datasource.password=dcm4che
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate Configuration
# ========================================

# Hibernate DDL auto (create, create-drop, validate, update, none)
# Use 'none' in production, let Liquibase handle schema
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in logs (disable in production)
spring.jpa.show-sql=false

# Format SQL output
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Enable statistics (useful for performance tuning)
spring.jpa.properties.hibernate.generate_statistics=false

# Enable second level cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ========================================
# Connection Pool (HikariCP)
# ========================================

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DCM4CHE-RIS-Pool

# ========================================
# Liquibase Configuration
# ========================================

# Enable Liquibase
spring.liquibase.enabled=true

# Liquibase changelog file
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Liquibase contexts (comma-separated)
#spring.liquibase.contexts=development,test

# Drop schema before applying changeset
spring.liquibase.drop-first=false

# ========================================
# JPA Repositories
# ========================================

# Base package for JPA repositories
spring.data.jpa.repositories.base-packages=org.dcm4che.ris.persistence.repository

# Enable repository metrics
management.metrics.enable.jpa=true

# ========================================
# Logging
# ========================================

# Logging levels
logging.level.org.dcm4che.ris.persistence=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.liquibase=INFO

# ========================================
# Validation
# ========================================

# Enable Bean Validation
spring.jpa.properties.javax.persistence.validation.mode=AUTO
