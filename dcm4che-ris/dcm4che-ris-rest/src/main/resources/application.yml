# RIS REST API Configuration

server:
  port: 8080
  servlet:
    context-path: /api/ris

spring:
  application:
    name: dcm4che-ris-rest

# API Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# REST API Settings
ris:
  rest:
    # CORS configuration
    cors:
      enabled: true
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowed-headers: "*"
      max-age: 3600

    # Pagination defaults
    pagination:
      default-page-size: 20
      max-page-size: 100

    # Security (optional)
    security:
      enabled: false
      # basic-auth-enabled: true
      # jwt-enabled: false

    # API versioning
    version: v1
